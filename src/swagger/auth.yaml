# =============================================
#  AUTH  –  /api/v1/auth
# =============================================

paths:
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account and sends a verification email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, firstName, lastName, email, password, confirmPassword, age]
              properties:
                userName:
                  type: string
                  example: johndoe
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "Password123!"
                confirmPassword:
                  type: string
                  format: password
                  example: "Password123!"
                age:
                  type: integer
                  minimum: 13
                  example: 25
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Validation error
        "409":
          description: User already exists
        "429":
          description: Too many requests

  /api/v1/auth/signin:
    post:
      tags: [Auth]
      summary: Sign in
      description: Authenticate with email/password and receive a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: "Password123!"
      responses:
        "200":
          description: Signed in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User signed in successfully
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT access token
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "429":
          description: Too many requests

  /api/v1/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      description: Verify user email with OTP or token sent via email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  description: 6-digit OTP code
                  example: "123456"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully
        "400":
          description: Invalid or expired OTP

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      description: Sends a password reset link to the user's email. Does not reveal whether the email exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Password reset link sent to your email
        "429":
          description: Too many requests

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      description: Reset password using the token received via email.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Password reset token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmPassword]
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                confirmPassword:
                  type: string
                  format: password
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Password reset successfully
        "400":
          description: Invalid or expired token
        "429":
          description: Too many requests
