# =============================================
#  COMMENTS  –  /api/v1/comments
# =============================================

paths:
  /api/v1/comments:
    post:
      tags: [Comments]
      summary: Create a comment or reply
      description: |
        Create a new comment on a post. Provide `parentCommentId` to create a nested reply.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, postId]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  example: "Great post!"
                postId:
                  type: string
                  description: Post ID
                parentCommentId:
                  type: string
                  nullable: true
                  description: Parent comment ID (for replies)
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Comment"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

    get:
      tags: [Comments]
      summary: Get all comments (search & filter)
      description: Returns comments with pagination. Optionally filter by postId.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SortParam"
        - in: query
          name: postId
          schema:
            type: string
          description: Filter by post ID
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized

  /api/v1/comments/{id}:
    get:
      tags: [Comments]
      summary: Get comment by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      responses:
        "200":
          description: Comment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized
        "404":
          description: Comment not found

    patch:
      tags: [Comments]
      summary: Update comment by ID
      description: Author only. Sets `isEdited` flag and `editedAt` timestamp.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not comment author
        "404":
          description: Comment not found

    delete:
      tags: [Comments]
      summary: Delete comment by ID
      description: Comment author or post author can delete.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comment deleted successfully
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Comment not found

  /api/v1/comments/{id}/replies:
    get:
      tags: [Comments]
      summary: Get replies to a comment
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MongoIdParam"
      responses:
        "200":
          description: Replies list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized
