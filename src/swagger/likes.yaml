# =============================================
#  LIKES  –  /api/v1/likes
# =============================================

paths:
  /api/v1/likes/toggle:
    post:
      tags: [Likes]
      summary: Toggle like on a post or comment
      description: |
        If the user has not liked the target, a like is created.
        If the user already liked the target, the like is removed.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId]
              properties:
                targetType:
                  type: string
                  enum: [Post, Comment]
                  example: Post
                targetId:
                  type: string
                  description: ID of the post or comment
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Like toggled successfully
                  data:
                    type: object
                    properties:
                      liked:
                        type: boolean
                        description: Current like state after toggle
                      totalLikes:
                        type: integer
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /api/v1/likes/count:
    get:
      tags: [Likes]
      summary: Get like count for a target
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: targetType
          required: true
          schema:
            type: string
            enum: [Post, Comment]
        - in: query
          name: targetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like count
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /api/v1/likes/check:
    get:
      tags: [Likes]
      summary: Check if current user liked a target
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: targetType
          required: true
          schema:
            type: string
            enum: [Post, Comment]
        - in: query
          name: targetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      liked:
                        type: boolean
        "400":
          description: Validation error
        "401":
          description: Unauthorized
